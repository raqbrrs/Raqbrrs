<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Fira Code, Consolas, monospace">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="760" height="220" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect x="0" y="0" width="760" height="220" fill="#0d1117"/>

    <!-- Title Bar -->
    <rect x="0" y="0" width="760" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="380" y="22" fill="#8b949e" font-size="12" text-anchor="middle">raqbrrs@sobre-mim: ~</text>

    <!-- Terminal Body -->
    <!-- First Command -->
    <text x="24" y="64" font-size="15" fill="#7ee787">raqbrrs</text>
    <text x="95" y="64" font-size="15" fill="#8b949e">:</text>
    <text x="103" y="64" font-size="15" fill="#79c0ff">~</text>
    <text x="115" y="64" font-size="15" fill="#8b949e">$ whoami</text>

    <!-- Name & Pronouns -->
    <text x="24" y="94" font-size="20" fill="#9D00FF" font-weight="600">
      raquel barros
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="200" y="94" font-size="16" fill="#8b949e">— she/her</text>

    <!-- Second Command -->
    <text x="24" y="128" font-size="15" fill="#7ee787">dev_raquel</text>
    <text x="115" y="130" font-size="15" fill="#8b949e">:</text>
    <text x="123" y="130" font-size="15" fill="#79c0ff">~</text>
    <text x="135" y="128" font-size="15" fill="#8b949e">$ cat profile.txt</text>

    <!-- Profile Details -->
    <text x="24" y="158" font-size="16" fill="#e6edf3">
      dev Java &amp; Spring Boot | Estudante de Desenv. de Sistemas
    </text>
    <text x="24" y="182" font-size="16" fill="#e6edf3">
      - raquelbrrs07@gmail.com
    </text>

    <!-- Blinking Cursor -->
    <rect x="250" y="170" width="9" height="16" fill="#9D00FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="759" height="219" rx="12" ry="12" fill="none" stroke="#30363d"/>
</svg>
